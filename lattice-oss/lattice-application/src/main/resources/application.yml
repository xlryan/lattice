spring:
  application:
    name: lattice
  autoconfigure:
    exclude:
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${LATTICE_DB_HOST:192.168.0.111}:${LATTICE_DB_PORT:25432}/${LATTICE_DB_NAME:lattice}
    username: ${LATTICE_DB_USER:grain_user}
    password: ${LATTICE_DB_PASSWORD:grain_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: lattice
        format_sql: true
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: lattice
    schemas: lattice
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:dummy-deepseek-key}
    openai:
      api-key: ${OPENAI_API_KEY:dummy-openai-key}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: gpt-oss:20b
          temperature: 0.1
      embedding:
        options:
          model: paraphrase-multilingual-MiniLM-L12-v2
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 384

lattice:
  ai:
    classification:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: gpt-oss:20b
