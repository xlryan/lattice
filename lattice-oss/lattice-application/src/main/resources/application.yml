      issuer: lattice
      expiry-seconds: 86400
  prompts:
    templates:
      career-star:
        description: STAR formatter for career logs
        content: |-
          你是一位技术写作者，请将以下内容转为 STAR JSON（situation, task, action, result）。
          要求：中文输出，字段完整且扼要。
          文本: {text}
      inbox-auto-classify:
        description: Inbox triage classifier
        content: |-
          根据输入内容，判断属于 CAREER/WEALTH/BUILD/KNOWLEDGE/INTEL/INBOX，并解释原因。
          输出 JSON: {"domain":"CAREER","reason":"..."}
  web:
    cors:
      allowed-origins: ${LATTICE_CORS_ORIGINS:http://localhost:3000,http://localhost:4173}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: lattice-core
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.lattice: INFO
    org.springframework.ai: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    level: "%5p"
