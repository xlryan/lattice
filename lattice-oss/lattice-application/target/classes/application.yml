spring:
  application:
    name: lattice
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${LATTICE_DB_HOST:192.168.0.111}:${LATTICE_DB_PORT:25432}/${LATTICE_DB_NAME:lattice}
    username: ${LATTICE_DB_USER:grain_user}
    password: ${LATTICE_DB_PASSWORD:grain_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: lattice
    schemas: lattice
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: gpt-oss:20b
          temperature: 0.1
      embedding:
        options:
          model: gpt-oss:20b
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1536

lattice:
  ai:
    classification:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: gpt-oss:20b
    embedding:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: gpt-oss:20b
  wealth:
    firefly:
      base-url: ${FIREFLY_BASE_URL:http://firefly:8080}
      token: ${FIREFLY_API_TOKEN:change-me}
      default-source-account: 现金账户
      default-destination-account: 生活开销
      default-category: 其他
      currency: CNY
      category-mappings:
        build: DIY/装修
        dining: 餐饮
  notifications:
    ntfy:
      enabled: ${NTFY_ENABLED:true}
      base-url: ${NTFY_BASE_URL:http://ntfy}
      topic: ${NTFY_TOPIC:lattice-events}
      title: ${NTFY_TITLE:Lattice 新节点}
      priority: ${NTFY_PRIORITY:3}
  python-worker:
    base-url: ${PY_WORKER_BASE_URL:http://python-worker:8081}
  security:
    jwt:
      secret: ${LATTICE_JWT_SECRET:lattice-secret-please-change}
      issuer: lattice
      expiry-seconds: 86400
  prompts:
    templates:
      career.star:
        description: STAR formatter for career logs
        content: |-
          你是一位技术写作者，请将以下内容转为 STAR JSON（situation, task, action, result）。
          要求：中文输出，字段完整且扼要。
          文本: {text}
      inbox.auto-classify:
        description: Inbox triage classifier
        content: |-
          根据输入内容，判断属于 CAREER/WEALTH/BUILD/KNOWLEDGE/INTEL/INBOX，并解释原因。
          输出 JSON: {"domain":"CAREER","reason":"..."}
  web:
    cors:
      allowed-origins: ${LATTICE_CORS_ORIGINS:http://localhost:3000,http://localhost:4173}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: lattice-core
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [traceId=%X{traceId} spanId=%X{spanId}]"
