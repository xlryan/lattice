spring:
  application:
    name: lattice
  datasource:
    url: jdbc:postgresql://192.168.0.111:25432/grain_log
    username: ${LATTICE_DB_USER:grain_user}
    password: ${LATTICE_DB_PASSWORD:grain_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.lob.non_contextual_creation: true
        default_schema: lattice
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: lattice
    schemas: lattice
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:change-me}
      base-url: https://api.deepseek.com/v1
      chat:
        options:
          model: deepseek-chat
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-large
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1536

lattice:
  ai:
    classification:
      base-url: https://api.deepseek.com/v1
      model: deepseek-chat
    embedding:
      base-url: https://api.deepseek.com/v1
      model: text-embedding-3-large
  finance:
    firefly:
      base-url: http://192.168.0.111:8080
      token: ${FIREFLY_API_TOKEN:change-me}
      default-source-account: 现金账户
      default-destination-account: 生活开销
      default-category: 其他
      currency: CNY
      category-mappings:
        diy: DIY/装修
        dining: 餐饮
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
